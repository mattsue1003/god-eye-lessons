<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>守護家人・上帝之眼</title>
<meta name="description" content="上帝之眼毛線編織帶領教案：一段影片、一段動手做，老師帶著學員一步一步完成守護家人的小作品。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1E6;        /* 米白 */
  --card:#FFFBF4;
  --ink:#4A3B32;
  --ink-soft:#7C6A5E;
  --line:#E6DACB;
  --rose:#C9707A;      /* 溫暖主色 */
  --rose-soft:#F3DCDC;
  --amber:#D9A050;
  --amber-soft:#F7E8CC;
  --sage:#8FA58A;
  --sage-soft:#E3EBDF;
  --plum:#8B6A8F;
  --shadow:0 10px 30px rgba(120,90,60,.10);
  --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Noto Serif TC","PingFang TC",serif}
button{font:inherit;cursor:pointer;border:0;border-radius:999px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}

/* 頂部 */
header{display:flex;align-items:center;gap:12px;padding:10px 0 6px}
header .logo{width:42px;height:42px;flex:none}
header .t{font-size:15px;color:var(--ink-soft)}
header .t b{display:block;font-size:22px;color:var(--ink);font-family:"Noto Serif TC",serif;line-height:1.3}
.spacer{flex:1}
.ghost{background:transparent;color:var(--ink-soft);padding:8px 14px;border:1.5px solid var(--line);white-space:nowrap}
.ghost:hover{background:var(--card)}

/* 進度 */
.progress{display:flex;gap:6px;margin:12px 0 18px}
.progress span{flex:1;height:8px;border-radius:99px;background:var(--line);transition:.3s}
.progress span.done{background:var(--sage)}
.progress span.now{background:var(--rose)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 26px 22px;margin-bottom:18px}
.eyebrow{font-size:14px;letter-spacing:.2em;color:var(--rose);font-weight:700;margin-bottom:4px}
h1{font-size:34px;margin:0 0 8px;line-height:1.3}
h2{font-size:28px;margin:0 0 6px;line-height:1.35}
h3{font-size:20px;margin:18px 0 8px}
p{margin:8px 0}
.soft{color:var(--ink-soft)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:700}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.amber{background:var(--amber-soft);color:#9A6B1E}
.pill.sage{background:var(--sage-soft);color:#4F6B4A}

/* 首頁課程選擇 */
.courses{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.course{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px;text-align:left;transition:.2s;color:var(--ink)}
.course:hover{border-color:var(--rose);transform:translateY(-2px)}
.course .ico{width:100%;height:120px;margin-bottom:10px}
.course b{font-size:22px;font-family:"Noto Serif TC",serif;display:block}
.course small{color:var(--ink-soft);font-size:15px;display:block;margin-top:4px}
.meaning{background:linear-gradient(135deg,var(--rose-soft),var(--amber-soft));border-radius:var(--r);padding:20px 24px;margin-top:4px}
.meaning p{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:15px}

/* 材料 */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.mats div{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:16px}
.mats div b{display:block;font-size:17px}

/* 影片區 */
.video-box{position:relative;border-radius:18px;overflow:hidden;background:#2B2420;aspect-ratio:16/9;margin:12px 0}
.video-box iframe,.video-box #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{background:var(--rose);color:#fff;padding:12px 24px;font-size:18px;font-weight:700;box-shadow:0 6px 16px rgba(201,112,122,.3);transition:.2s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.sage{background:var(--sage);box-shadow:0 6px 16px rgba(143,165,138,.35)}
.btn.amber{background:var(--amber);box-shadow:0 6px 16px rgba(217,160,80,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.hint{font-size:15px;color:var(--ink-soft)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 16px rgba(201,112,122,.3)}50%{box-shadow:0 6px 26px rgba(201,112,122,.6)}}

/* 步驟 */
.steps{list-style:none;padding:0;margin:10px 0 0}
.steps li{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);margin-bottom:10px;background:#fff;cursor:pointer;transition:.2s;font-size:19px}
.steps li:hover{border-color:var(--rose)}
.steps li.ok{background:var(--sage-soft);border-color:var(--sage)}
.steps li .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center;font-weight:700;font-size:17px;margin-top:3px}
.steps li.ok .n{background:var(--sage);color:#fff}
.steps li.ok .n::before{content:"✓"}
.steps li.ok .n span{display:none}
.tipbox{border-left:4px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 14px 14px 0;margin-top:14px;font-size:16px}
.tipbox b{color:#9A6B1E}
.talkbox{border-left:4px solid var(--plum);background:#EFE6F0;padding:12px 16px;border-radius:0 14px 14px 0;margin-top:12px;font-size:16px}
.talkbox b{color:var(--plum)}

/* 完成頁 */
.finish{text-align:center;padding:40px 20px}
.finish svg{width:160px;height:160px}
.finish h2{font-size:32px}

/* 老師模式：放大字體 */
body.big{font-size:22px}
body.big .steps li{font-size:24px;padding:18px 20px}
body.big h2{font-size:34px}
body.big .btn{font-size:22px;padding:16px 30px}

footer{text-align:center;color:var(--ink-soft);font-size:14px;margin-top:30px}
.hide{display:none!important}
@media (max-width:640px){
  .courses{grid-template-columns:1fr}
  h1{font-size:28px} h2{font-size:24px}
  .card{padding:20px 18px}
  header .t b{font-size:17px} header .t{font-size:13px} .ghost{padding:6px 10px;font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <g transform="translate(24 24)">
      <rect x="-21" y="-1.5" width="42" height="3" rx="1.5" fill="#A98468" transform="rotate(45)"/>
      <rect x="-21" y="-1.5" width="42" height="3" rx="1.5" fill="#A98468" transform="rotate(-45)"/>
      <path d="M0-19 19 0 0 19-19 0Z" fill="#C9707A"/>
      <path d="M0-13 13 0 0 13-13 0Z" fill="#F7E8CC"/>
      <path d="M0-7 7 0 0 7-7 0Z" fill="#D9A050"/>
      <circle r="2.5" fill="#4A3B32"/>
    </g>
  </svg>
  <div class="t"><b>守護家人・上帝之眼</b>一段影片，一段動手做</div>
  <div class="spacer"></div>
  <button class="ghost" id="bigBtn" title="投影時放大字體">放大字</button>
  <button class="ghost hide" id="homeBtn">回首頁</button>
</header>

<div id="app"></div>

<footer>愛迪樂｜鍾孟修 職能治療師　·　影片來源：YouTube 原作者頻道，本頁僅做教學片段導引</footer>
</div>

<script>
/* ===================== 課程資料 ===================== */
const COURSES = [
{
  id:'four', video:'KWKRaccom08', name:'四角上帝之眼',
  sub:'兩根竹筷、四色毛線，約 40 分鐘', level:'入門',
  intro:'最經典的上帝之眼。只要「繞一圈、換下一根」一直重複，菱形就會自己長出來。',
  materials:[
    ['竹筷 2 根','或木棍、冰棒棍'],
    ['毛線 4 色','示範用紫、白、黃、黑'],
    ['剪刀 1 把','']
  ],
  segs:[
    {t:'認識材料', s:12, e:18, w:'先看看今天要用的東西。',
     steps:['把兩根竹筷、四色毛線、剪刀放在面前','選好自己的第一個顏色，想一想這個顏色代表誰'],
     tip:'請學員把毛線先拉出約一公尺，不要整球拿在手上，比較不會打結。',
     talk:'今天做的「上帝之眼」是墨西哥惠喬族送給孩子的護身符，每繞一圈就是一個祝福。你想把它送給誰？'},
    {t:'竹筷固定與十字定位', s:18, e:55, w:'把兩根竹筷綁成十字。',
     steps:['兩根竹筷並排拿好，找到中間位置','用第一色毛線在中心打 1 到 2 個結綁緊','把兩根竹筷轉開，變成垂直的十字','一手緊握中心點，固定十字角度不滑動'],
     tip:'手比較沒力的學員，可以先用一小段紙膠帶把十字貼住，再綁線。'},
    {t:'核心菱形編織（第一色）', s:55, e:112, w:'繞一圈、換下一根，中心會慢慢浮出菱形。',
     steps:['毛線在第一根木棍上繞一圈','拉到相鄰的下一根木棍，再繞一圈','順著同一個方向（順時針或逆時針）一直重複','看到中心出現對稱的小菱形，就代表做對了'],

     steps:['用剪刀剪斷第一色毛線','線頭翻到背面，打 1 到 2 個死結固定','接上第二色毛線，同樣在木棍背面打結','照原本的順序繼續逐棍繞圈，菱形往外長'],
     tip:'打結都在背面，正面才會乾淨。先示範一次「翻面、打結、翻回來」再讓大家做。'},
    {t:'層次換色（第三色）', s:171, e:206, w:'再換一色，讓層次往外延伸。',
     steps:['第二色完成後剪線，背面打結','接上第三色毛線','維持一樣的拉力和順序，繼續繞'],
     tip:'提醒學員每一圈都要貼緊上一圈，中間不要留縫。'},
    {t:'外框包邊（第四色）', s:206, e:221, w:'用深色做最外層的邊框。',

    {t:'製作頂部吊繩環', s:221, e:255, w:'做一個可以掛起來的小環。',
     steps:['繞到最上面那根木棍時，把線拉起來折成一個小環','用剩下的線在小環根部緊密纏繞幾圈固定','翻到背面打死結鎖緊'],

    {t:'修剪線頭與完成', s:255, e:297, w:'把背面整理乾淨，作品就完成了。',
     steps:['作品翻到背面','把換線和收尾留下的線頭全部剪整齊','整理平整，用頂端吊環掛起來'],
     tip:'請每個人把作品舉起來，大家互相看一看、拍張合照。',
     talk:'作品完成了。你想把它掛在家裡哪裡？想對它守護的那個人說一句什麼話？'}
  ]
},
{
  id:'six', video:'DK8gwLVY1Ro', name:'六角毛線曼陀羅',
  sub:'三根木棒、漸層毛線，約 90 分鐘', level:'進階',
  intro:'三根木棒撐出六角星，兩個三角形交錯穿插，像一朵慢慢綻放的花。適合已經做過四角版的學員。',
  materials:[
    ['木棒 3 根','約 30 公分，竹籤或木筷也可以'],
    ['毛線','棕、米白、黑、紫紅漸層、亮黃'],
    ['尺與鉛筆','標記中心往外 5 公分'],
    ['毛線縫針','穿引交疊毛線時輔助'],
    ['剪刀','']
  ],
  segs:[
    {t:'六角骨架與中央六邊形', s:9, e:79, w:'三根木棒打開成六角星，先繞出棕色中心。',
     steps:['三根木棒併攏，用棕色毛線在正中心打結','三根木棒依序展開，分成六個均勻的夾角','抓緊中心交叉點，每根木棒繞一圈再移到下一根','重複繞到出現緊密對稱的棕色六邊形'],

     talk:'六個方向，像家裡的每一個人。今天的作品想守護哪些人？'},
    {t:'標記距離與間隔纏線', s:79, e:135, w:'量 5 公分，用米白線把每根木棒包起來。',
     steps:['用尺和鉛筆從中心往外量，在每根木棒 5 公分處做記號','取米白色毛線，沿著每根木棒緊密螺旋纏繞到記號處','六根都纏好，留出乾淨的間距'],
     tip:'纏木棒的時候線要一圈貼一圈，不然會看到木頭。'},
    {t:'第一組三角形（黑色與粉紫漸層）', s:135, e:270, w:'隔一根繞一根，拉出第一個三角形。',
     steps:['黑色毛線綁在其中一根木棒的米白交界處','只繞第 1、3、5 根：繞一圈，拉到下一個頂點，再繞一圈','重複到出現清楚的黑色三角形','依序換深紫、深桃紅、淺粉紅，順著同一個三角形往外繞'],
     tip:'請學員先用手指點一點「1、3、5」三根，確定不會繞錯根。'},
    {t:'第二組三角形穿插（交錯六角星）', s:270, e:588, w:'換另外三根，從上面跨、從下面穿，咬住第一個三角形。',
     steps:['換到第 2、4、6 根木棒，用黑色毛線開始第二個三角形','每一段都「從上方跨過第一個三角形、繞木棒一圈、再從圖案下方穿過」','需要時用毛線縫針幫忙穿引','黑色完成後，再依序用深紫到粉紅的漸層重複同樣繞法'],

    {t:'頂部吊繩與木棒包邊收尾', s:672, e:706, w:'包住木棒末端，做吊圈，剪線頭。',
     steps:['用米白色毛線緊密纏繞外露的木棒末端','繞到頂端時打結，留出一個小吊圈','剪掉多餘線頭，整理平整'],
     tip:'請每個人把作品舉起來，大家互相看一看、拍張合照。',

}];

/* ===================== 狀態 ===================== */
const KEY='godeye-progress';
let state = load() || {course:null, seg:0, phase:'home', done:{}};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const app=document.getElementById('app');
const homeBtn=document.getElementById('homeBtn');
let player=null, endTimer=null, ytReady=false;

/* YouTube API */
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{ytReady=true; if(state.phase==='watch') mountPlayer();};

function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function course(){return COURSES.find(c=>c.id===state.course)}

/* ===================== 畫面 ===================== */
function render(){
  destroyPlayer();
  homeBtn.classList.toggle('hide', state.phase==='home');
  if(state.phase==='home') return renderHome();
  if(state.phase==='finish') return renderFinish();
  renderSeg();
}

function eyeSVG(cls,color1,color2){
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(60 60)">
  <rect x="-52" y="-2" width="104" height="4" rx="2" fill="#A98468" transform="rotate(45)"/>
  <rect x="-52" y="-2" width="104" height="4" rx="2" fill="#A98468" transform="rotate(-45)"/>
  <path d="M0-44 44 0 0 44-44 0Z" fill="${color1}"/><path d="M0-32 32 0 0 32-32 0Z" fill="#FFFBF4"/>
  <path d="M0-20 20 0 0 20-20 0Z" fill="${color2}"/><path d="M0-9 9 0 0 9-9 0Z" fill="#4A3B32"/></g></svg>`;
}
function starSVG(cls){
  const tri=(rot,c)=>`<path d="M0-40 34.6 20-34.6 20Z" fill="${c}" transform="rotate(${rot})"/>`;
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(60 60)">
  ${[0,60,120].map(r=>`<rect x="-54" y="-2" width="108" height="4" rx="2" fill="#A98468" transform="rotate(${r})"/>`).join('')}
  ${tri(0,'#8B6A8F')}${tri(180,'#C9707A')}
  <path d="M0-22 19 -11 19 11 0 22 -19 11 -19 -11Z" fill="#D9A050"/><circle r="7" fill="#4A3B32"/></g></svg>`;
}

function renderHome(){
  app.innerHTML=`
  <div class="card">
    <div class="eyebrow">毛線手作・心情陪伴</div>
    <h1>守護家人・上帝之眼</h1>
    <p class="soft">一段影片、一段動手做。老師按一下播放，大家先看；影片收起來後，跟著文字步驟一步一步完成，再進入下一段。</p>
    <div class="meaning">
      <p><b class="serif">為什麼叫「上帝之眼」？</b></p>
      <p>Ojo de Dios 來自墨西哥惠喬族。孩子出生時，父親會為他編一個中心的眼睛，之後每一年再加一圈，直到五歲。這雙眼睛替家人看顧四方，也把家人的祝福一圈一圈繞在一起。</p>
      <div class="chips"><span>每一圈都是一個祝福</span><span>顏色代表想守護的人</span><span>做完掛在家裡</span></div>
    </div>
    <div class="courses">
      ${COURSES.map(c=>`<button class="course" data-c="${c.id}">
        ${c.id==='four'?eyeSVG('ico','#C9707A','#D9A050'):starSVG('ico')}
        <span class="pill ${c.id==='four'?'sage':'amber'}">${c.level}</span>
        <b>${c.name}</b><small>${c.sub}　·　${c.segs.length} 段</small>
        <small>${c.intro}</small>
      </button>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">帶領方式</h3>
    <p class="soft">1　投影本頁，按「播放這一段」，影片只會播到這一段的結束點就停。<br>
    2　按「看完了，一起動手做」，影片收起，畫面只剩文字步驟。老師照著唸，做完一項點一下打勾。<br>
    3　全部打勾後按「進入下一段」。進度會自動記住，下週可以接著做。<br>
    4　每段下方有「聊一聊」，適合在等慢的學員時帶大家說說話。</p>
  </div>`;
  app.querySelectorAll('.course').forEach(b=>b.onclick=()=>{
    state.course=b.dataset.c;
    const prog=state.done[state.course];
    state.seg = prog && prog.seg!=null ? prog.seg : 0;
    state.phase = (prog && prog.seg!=null && prog.seg>=course().segs.length) ? 'finish' : 'watch';
    if(state.phase==='finish'){ state.seg=course().segs.length; }
    save(); render();
  });
}

function renderSeg(){
  const c=course(), seg=c.segs[state.seg], n=c.segs.length;
  const checks=(state.done[c.id]&&state.done[c.id].checks&&state.done[c.id].checks[state.seg])||[];
  app.innerHTML=`
  <div class="progress">${c.segs.map((_,i)=>`<span class="${i<state.seg?'done':i===state.seg?'now':''}"></span>`).join('')}</div>
  <div class="card">
    <div class="eyebrow">${c.name}　第 ${state.seg+1} 段 / 共 ${n} 段</div>
    <h2>${seg.t}</h2>
    <p class="soft">${seg.w}</p>

    <div id="watch" class="${state.phase==='watch'?'':'hide'}">
      ${state.seg===0?`<h3>所需材料</h3><div class="mats">${c.materials.map(m=>`<div><b>${m[0]}</b>${m[1]}</div>`).join('')}</div>`:''}
      <div class="video-meta" style="margin-top:14px"><span class="pill rose">影片片段</span><span>${fmt(seg.s)} 到 ${fmt(seg.e)}，約 ${seg.e-seg.s} 秒</span></div>
      <div class="video-box"><div id="player"></div></div>
      <div class="actions">
        <button class="btn" id="playBtn">▶ 播放這一段</button>
        <button class="btn sage" id="toDoBtn">看完了，一起動手做</button>
        <span class="hint" id="watchHint">影片播到結束點會自動停下來</span>
      </div>
    </div>

    <div id="do" class="${state.phase==='do'?'':'hide'}">
      <h3>跟著做，做完一項點一下</h3>
      <ul class="steps">${seg.steps.map((s,i)=>`<li data-i="${i}" class="${checks[i]?'ok':''}"><span class="n"><span>${i+1}</span></span><div>${s}</div></li>`).join('')}</ul>
      ${seg.tip?`<div class="tipbox"><b>帶領提醒</b>　${seg.tip}</div>`:''}
      ${seg.talk?`<div class="talkbox"><b>聊一聊</b>　${seg.talk}</div>`:''}
      <div class="actions">
        <button class="btn ghost" id="rewatchBtn" style="background:transparent;color:var(--ink-soft);box-shadow:none">再看一次影片</button>
        <button class="btn" id="nextBtn">${state.seg===n-1?'全部完成':'進入下一段 →'}</button>
        <span class="hint" id="doHint"></span>
      </div>
    </div>
  </div>
  <div class="actions" style="justify-content:space-between">
    <button class="ghost" id="prevBtn" ${state.seg===0?'disabled':''}>← 上一段</button>
    <button class="ghost" id="skipBtn">跳到下一段</button>
  </div>`;

  const playBtn=app.querySelector('#playBtn'), toDo=app.querySelector('#toDoBtn');
  playBtn.onclick=()=>{ if(player&&player.seekTo){player.seekTo(seg.s,true);player.playVideo();} else mountPlayer(true); playBtn.textContent='▶ 從頭再播一次'; };
  toDo.onclick=()=>{state.phase='do';save();render();};
  app.querySelector('#rewatchBtn').onclick=()=>{state.phase='watch';save();render();};
  app.querySelector('#prevBtn').onclick=()=>{ if(state.seg>0){state.seg--;state.phase='watch';save();render();} };
  app.querySelector('#skipBtn').onclick=()=>advance();
  app.querySelector('#nextBtn').onclick=()=>advance();
  app.querySelectorAll('.steps li').forEach(li=>li.onclick=()=>{
    li.classList.toggle('ok');
    const d=state.done[c.id]=state.done[c.id]||{seg:state.seg,checks:{}};
    d.checks=d.checks||{}; d.checks[state.seg]=[...app.querySelectorAll('.steps li')].map(x=>x.classList.contains('ok'));
    save(); updateDoHint();
  });
  updateDoHint();
  if(state.phase==='watch' && ytReady) mountPlayer(false);
}
function updateDoHint(){
  const lis=[...app.querySelectorAll('.steps li')]; if(!lis.length) return;
  const left=lis.filter(l=>!l.classList.contains('ok')).length;
  const hint=app.querySelector('#doHint'), nb=app.querySelector('#nextBtn');
  hint.textContent = left? `還有 ${left} 項` : '這一段完成了';
  nb.classList.toggle('pulse', left===0);
}
function advance(){
  const c=course(); state.seg++; state.phase='watch';
  const d=state.done[c.id]=state.done[c.id]||{checks:{}}; d.seg=state.seg;
  if(state.seg>=c.segs.length){state.phase='finish';}
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}

function renderFinish(){
  const c=course();
  app.innerHTML=`
  <div class="progress">${c.segs.map(()=>`<span class="done"></span>`).join('')}</div>
  <div class="card finish">
    ${c.id==='four'?eyeSVG('','#C9707A','#D9A050'):starSVG('')}
    <h2>作品完成了</h2>
    <p class="soft">${c.name}的每一圈都繞好了。把它掛在家裡看得見的地方，讓它替你守護想守護的人。</p>
    <div class="talkbox" style="text-align:left;max-width:560px;margin:18px auto"><b>結尾分享</b>　請每位學員說一句：「這個作品我想送給＿＿＿，因為＿＿＿。」</div>
    <div class="actions" style="justify-content:center">
      <button class="btn amber" id="restartBtn">重新做一次這門課</button>
      <button class="btn" id="otherBtn">回首頁選另一門課</button>
    </div>
  </div>`;
  app.querySelector('#restartBtn').onclick=()=>{delete state.done[c.id];state.seg=0;state.phase='watch';save();render();};
  app.querySelector('#otherBtn').onclick=goHome;
}

/* ===================== 播放器 ===================== */
function mountPlayer(autoplay){
  const c=course(); if(!c||state.phase!=='watch'||!ytReady) return;
  const seg=c.segs[state.seg];
  const host=document.getElementById('player'); if(!host) return;
  destroyPlayer();
  player=new YT.Player('player',{
    videoId:c.video,
    playerVars:{start:seg.s,end:seg.e,rel:0,modestbranding:1,playsinline:1,autoplay:autoplay?1:0,hl:'zh-TW'},
    events:{
      onReady:e=>{ if(autoplay){e.target.seekTo(seg.s,true);e.target.playVideo();} },
      onStateChange:e=>{
        const hint=app.querySelector('#watchHint'), toDo=app.querySelector('#toDoBtn');
        if(e.data===YT.PlayerState.PLAYING){
          clearInterval(endTimer);
          endTimer=setInterval(()=>{ if(player&&player.getCurrentTime&&player.getCurrentTime()>=seg.e-0.3){player.pauseVideo();clearInterval(endTimer);} },300);
        }
        if(e.data===YT.PlayerState.ENDED||e.data===YT.PlayerState.PAUSED){
          clearInterval(endTimer);
          if(player.getCurrentTime()>=seg.e-1){
            if(hint) hint.textContent='這一段播完了，可以開始動手做';
            if(toDo) toDo.classList.add('pulse');
          }
        }
      }
    }
  });
}
function destroyPlayer(){ clearInterval(endTimer); if(player&&player.destroy){try{player.destroy()}catch(e){}} player=null; }

/* ===================== 其他 ===================== */
function goHome(){ state.phase='home'; save(); render(); }
homeBtn.onclick=goHome;
document.getElementById('bigBtn').onclick=()=>{ document.body.classList.toggle('big'); try{localStorage.setItem('godeye-big',document.body.classList.contains('big')?'1':'')}catch(e){} };
try{ if(localStorage.getItem('godeye-big')==='1') document.body.classList.add('big'); }catch(e){}
render();
</script>
</body>
